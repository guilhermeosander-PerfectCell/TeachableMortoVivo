<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Morto-Vivo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="setup">
    <h1 class="titulo-setup">🎮 MORTO-VIVO🤖</h1>
    <input type="text" id="url" value="https://teachablemachine.withgoogle.com/models/X38KFMOYu/">
    <button class="btn-grande" onclick="iniciar()">ENTRAR NO JOGO 🚀</button>
  </div>

  <div id="jogo" style="display:none">
    <div class="hud">
      <div id="comando" class="comando-box">...</div>
      <div id="tempo" class="tempo-box">5.0s</div>
    </div>
    
    <div class="arena">
      <div class="player p1">
        <h2>JOGADOR 1</h2>
        <canvas id="c1"></canvas>
        <div id="st1" class="status-badge">--</div>
      </div>
      
      <div class="player p2">
        <h2>JOGADOR 2</h2>
        <canvas id="c2"></canvas>
        <div id="st2" class="status-badge">--</div>
      </div>
    </div>

    <div id="resultado" class="resultado-box"></div>
    <button id="btn-reiniciar" class="btn-grande" onclick="reiniciar()" style="display:none">PRÓXIMA RODADA 🔄</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
